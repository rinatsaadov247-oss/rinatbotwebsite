
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rinat Bot | Discord</title>
  <meta name="description" content="Rinat Bot — Discord serverin üçün faydalı bot.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background: #0b1020;
      text-align: center;
    }
    header { padding: 25px; }
    .logo { font-size: 25px; font-weight: bold; color: #a5b4fc; }
    main { padding: 90px 20px; }
    h1 { font-size: clamp(38px, 7vw, 65px); margin-bottom: 15px; }
    h1 span { color: #818cf8; }
    p { color: #b8c0d9; font-size: 18px; line-height: 1.7; }
    .card {
      max-width: 600px; margin: 35px auto; padding: 35px;
      background: #151d33; border: 1px solid #303b5b;
      border-radius: 22px;
    }
    .avatar {
      margin: auto; width: 85px; height: 85px; border-radius: 25px;
      display: grid; place-items: center; font-size: 40px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
    }
    .button {
      display: inline-block; margin-top: 18px; padding: 15px 25px;
      border-radius: 12px; background: #5865f2; color: white;
      text-decoration: none; font-weight: bold;
    }
    .button:hover { background: #4752c4; }
    footer { padding: 25px; color: #929bb5; }
  </style>
</head>
<body>
  <header><div class="logo">✦ RINAT BOT</div></header>
  <main>
    <h1>Discord serverin üçün<br><span>güclü köməkçi.</span></h1>
    <p>Rinat Bot ilə serverindəki işləri daha rahat idarə et.</p>
    <div class="card">
      <div class="avatar">✦</div>
      <h2>Rinat Bot</h2>
      <p>Səs kanalına qoşulma və slash komandaları.</p>
      <a class="button" href="https://discord.com/developers/applications">
        Botu əlavə et
      </a>
    </div>
  </main>
  <footer>© 2026 Rinat Bot</footer>
</body>
</html>
